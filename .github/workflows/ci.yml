name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Manifests, changelog and skills agree
        run: node scripts/check.mjs
      - name: Claude plugin and marketplace validate
        run: |
          npx -y @anthropic-ai/claude-code@2.1.294 plugin validate . --strict
          npx -y @anthropic-ai/claude-code@2.1.294 plugin validate .claude-plugin/marketplace.json
      - name: Gemini extension validates
        run: npx -y @google/gemini-cli@0.63.0 extensions validate .
      - name: ZIP builds
        run: bash scripts/build-zip.sh
